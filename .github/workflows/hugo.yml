name: Hugo Actions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.122.0'
          extended: false

      - name: Build Site
        run: |
          # Create a temporary Hugo site
          mkdir -p /tmp/hugo-site
          cp -R exampleSite/* /tmp/hugo-site/
          # Copy theme layouts and static files into the site
          cp -r layouts /tmp/hugo-site/
          cp -r static /tmp/hugo-site/
          cp -r data /tmp/hugo-site/
          # Build the site
          cd /tmp/hugo-site
          hugo --baseURL https://zhichange.github.io/hugo/

      - name: Deploy Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/hugo-site/public
          publish_branch: gh-pages
          force_orphan: true
          full_commit_message: ${{ github.event.head_commit.message }}
