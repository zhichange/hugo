name: Hugo Actions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.122.0'
          extended: false

      - name: Build Site
        run: |
          mkdir -p /tmp/hugo-site
          cp -R exampleSite/* /tmp/hugo-site/
          cp -r layouts /tmp/hugo-site/
          cp -r static /tmp/hugo-site/
          cp -r data /tmp/hugo-site/
          cd /tmp/hugo-site
          hugo --baseURL https://zhichange.github.io/hugo/

      - name: Deploy to main
        run: |
          cd /tmp/hugo-site
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B main
          git add -A
          git commit -m "Deploy Hugo site $(git rev-parse --short HEAD)"
          git push https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/zhichange/hugo.git main --force
